<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f7dcc0" />
  <title>クッキーをつくろう！</title>
  <script type="module" crossorigin src="./assets/index-D8e1x-HA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-ED0pHCjz.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header id="recipe" aria-live="polite">
    <button class="rbar" id="rbar" type="button">
      <span class="rcur" id="rcur"></span>
      <span class="rtoggle" id="rtoggle">レシピ ▴</span>
    </button>
    <div class="rbody" id="rbody">
      <div class="recipe-title" id="recipe-title"></div>
      <div class="sec">材料</div>
      <ul class="chips" id="ingredients"></ul>
      <div class="sec">工程</div>
      <ol class="steplist" id="steplist"></ol>
    </div>
    <button class="btn primary" id="btn-start" type="button">スタート</button>
    <div class="hint" id="hint"></div>
  </header>

  <button id="btn-sound" class="icon-btn" type="button" aria-label="効果音">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path class="on" d="M16 9a4 4 0 0 1 0 6"/>
      <path class="on" d="M18.5 6.5a8 8 0 0 1 0 11"/>
      <path class="off" d="M16 9l5 6M21 9l-5 6"/>
    </svg>
  </button>

  <div id="bigtext"></div>

  <div id="sideview" hidden>
    <div class="sv-label">いまの厚さ（横から）</div>
    <div class="sv-stage"><div class="sv-slab" id="sv-slab"></div></div>
  </div>

  <div id="dials" hidden>
    <div class="dial-col"><canvas id="dial-temp" width="150" height="150"></canvas></div>
    <div class="dial-col"><canvas id="dial-time" width="150" height="150"></canvas></div>
  </div>

  <div id="extra" hidden></div>

  <footer id="controls">
    <button id="btn-sensor" class="btn ghost" type="button" hidden>傾きセンサー: OFF</button>
    <button id="btn-next" class="btn primary" type="button">次へ</button>
  </footer>

  <div id="toast" role="status"></div>

  <div id="overlay" hidden>
    <div class="card" id="card"></div>
  </div>

</body>
</html>
