<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#4aa8ff" />
  <title>ぐんぐん育て、どこまでも！</title>
  <script type="module" crossorigin src="./assets/index-Bkc5FwSv.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-COO9rx2q.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header id="hud">
    <div class="hud-top">
      <div class="alt">
        <span id="hud-height">0</span><span id="hud-unit">m</span>
      </div>
      <div class="meta">
        <span id="hud-stage">草原</span>
        <span id="hud-best"></span>
      </div>
    </div>
    <div id="gauge" data-level="ok" aria-label="ストレス">
      <span class="g-label">ストレス</span>
      <div class="g-track">
        <div class="g-lost g-lost-l" id="gauge-lost-l"></div>
        <div class="g-lost g-lost-r" id="gauge-lost-r"></div>
        <div class="g-center"></div>
        <div id="gauge-fill"></div>
        <div id="gauge-needle"></div>
      </div>
    </div>
  </header>

  <button id="btn-sound" class="icon-btn" type="button" aria-label="効果音">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path class="on" d="M16 9a4 4 0 0 1 0 6"/>
      <path class="on" d="M18.5 6.5a8 8 0 0 1 0 11"/>
      <path class="off" d="M16 9l5 6M21 9l-5 6"/>
    </svg>
  </button>

  <div id="banner" role="status"><span class="b-title" id="b-title"></span><span class="b-sub" id="b-sub"></span></div>

  <footer id="controls">
    <button id="btn-sensor" class="btn ghost" type="button" hidden>傾きセンサー: OFF</button>
  </footer>

  <div id="toast" role="status"></div>

  <div id="overlay" hidden>
    <div class="tag" id="tag">
      <div class="card" id="card"></div>
    </div>
  </div>

</body>
</html>
