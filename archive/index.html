<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#e4dccf" />
  <title>ボツ置き場</title>
  <style>
    :root { --bg: #e4dccf; --card: #f7f3ec; --ink: #3a3328; --accent: #7a8a86; --accent-d: #56645f; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p.note { margin: 0 0 18px; font-size: 13px; opacity: .75; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    a.game {
      display: block; background: var(--card); color: inherit; text-decoration: none;
      border-radius: 18px; padding: 16px 18px; box-shadow: 0 4px 0 rgba(60,50,35,.2);
    }
    a.game:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(60,50,35,.2); }
    .name { font-size: 18px; font-weight: 800; }
    .desc { margin-top: 4px; font-size: 13px; opacity: .75; }
    .go { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: 13px; }
    a.game:focus-visible, a.back:focus-visible { outline: 3px solid var(--accent-d); outline-offset: 2px; }
    a.back { display: inline-block; margin-top: 22px; font-size: 13px; color: var(--accent-d); }
  </style>
</head>
<body>
  <main>
    <h1>ボツ置き場</h1>
    <p class="note">公開ゲームとは別の置き場所です。作りかけで終えたゲームを、記録としてそのまま遊べる形で残しています。</p>
    <ul>
      <li>
        <a class="game" href="./cchain/">
          <div class="name">伸ばせ！炭素鎖！</div>
          <div class="desc">試薬を選んで炭素鎖を伸ばし、できた分子の日本語名を楽しむ実験室ゲーム（ボツ）</div>
          <span class="go">あそぶ</span>
        </a>
      </li>
    </ul>
    <a class="back" href="../">ゲーム集にもどる</a>
  </main>
</body>
</html>
