<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040a16" />
    <title>どこ？マダガスカル！</title>
    <script type="module" crossorigin src="./assets/index-C0U27Uzq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DP-_sDmB.css">
  </head>
  <body>
    <canvas id="globe"></canvas>

    <div id="hud" hidden>
      <header id="top">
        <div class="stagechip"><span id="stageLabel"></span></div>
        <div class="meta"><span id="timer">0:00.0</span><span id="total">0</span></div>
        <section class="card">
          <canvas id="shape" aria-hidden="true"></canvas>
          <h2 id="targetName">—</h2>
        </section>
      </header>

      <div id="arrow" hidden aria-label="お題の方向">
        <svg viewBox="0 0 48 48" width="48" height="48"><path d="M24 4 L40 36 L24 29 L8 36 Z" /></svg>
        <span id="arrowNear" hidden>ちかい！</span>
      </div>

      <!-- ドラッグの見本（最初に触ると消える） -->
      <div id="hand" hidden aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64"><path d="M26 30V14a4 4 0 0 1 8 0v14h2v-6a4 4 0 0 1 8 0v8h2v-4a4 4 0 0 1 8 0v14c0 11-7 20-18 20-8 0-12-4-16-10l-8-12a4 4 0 0 1 7-4l5 6z" /></svg>
      </div>
      <div id="toast" hidden></div>

      <footer id="bottom">
        <div id="hintbar">
          <button class="hint" id="hint1" data-i="0" aria-label="ヒント1: 半球">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /></svg><span><b>ヒント1</b><i>-100</i></span>
          </button>
          <button class="hint" id="hint2" data-i="1" aria-label="ヒント2: 地域">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" /><circle cx="12" cy="10" r="2.5" /></svg><span><b>ヒント2</b><i>-150</i></span>
          </button>
          <button class="hint" id="hint3" data-i="2" aria-label="ヒント3: 方向の矢印">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 17-7-4-7 4z" /></svg><span><b>ヒント3</b><i>-400</i></span>
          </button>
        </div>
        <ul id="hintlog"></ul>
        <div id="reveal" hidden>
          <p class="found" id="foundText">ここ、—！</p>
          <p class="gain" id="gain"></p>
          <div class="stats" id="stats"></div>
          <button class="cta" id="nextBtn">次へ</button>
        </div>
      </footer>
    </div>

    <div id="markers"></div>

    <!-- 正解の演出 -->
    <div id="burst" hidden aria-hidden="true">
      <div class="flash"></div>
      <div class="rays"></div>
      <div class="rings"></div>
      <canvas id="confetti"></canvas>
      <p class="bigtext"></p>
    </div>

    <section id="title" class="screen">
      <h1><span>どこ？</span><span class="big">マダガスカル！</span></h1>
      <button class="cta" id="startBtn">はじめる</button>
      <p class="credit">地図データ: Natural Earth（パブリックドメイン）</p>
    </section>

    <section id="final" class="screen" hidden>
      <div class="rank"><span id="rankLabel">S</span><p id="rankComment"></p></div>
      <p class="totalscore"><span id="finalTotal">0</span><small>pt</small></p>
      <ol id="finalList"></ol>
      <div class="row">
        <button class="cta" id="againBtn">もういちど</button>
        <button class="ghost" id="titleBtn">タイトルへ</button>
      </div>
    </section>

  </body>
</html>
